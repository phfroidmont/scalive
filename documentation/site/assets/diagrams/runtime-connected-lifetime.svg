<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" role="img" aria-labelledby="connected-title connected-desc">
  <title id="connected-title">Connected runtime ownership</title>
  <desc id="connected-desc">A browser LiveSocket exchanges inbound and outbound frames with a WebSocket scope admitted through a signed join gate. PhoenixProtocol and one physical writer serve a ConnectionSupervisor. The supervisor owns one root RootConnection and zero or more nested root connections with independent lifecycles. Each connection has bounded ingress, a SessionKernel, and a committed revision.</desc>
  <defs>
    <marker id="connected-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" class="marker-blue"/></marker>
    <marker id="connected-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" class="marker-red"/></marker>
    <style>
      @import url("fonts.css");
      svg { color-scheme:light; --bg:#f4f1eb; --surface:#fff; --subtle:#ece8e0; --text:#171719; --muted:#67645f; --border:#d8d2c7; --border-strong:#aca69c; --red:#ee2946; --blue:#2a63d4; --green:#17755c; --amber:#9b630d; }
      svg[data-theme="dark"] { color-scheme:dark; --bg:#111114; --surface:#19191d; --subtle:#202025; --text:#f1efe9; --muted:#aaa7a1; --border:#34343a; --border-strong:#55555d; --red:#ff3a55; --blue:#79a8ff; --green:#65c7a6; --amber:#e0b05c; }
      svg[data-theme="light"] { color-scheme:light; --bg:#f4f1eb; --surface:#fff; --subtle:#ece8e0; --text:#171719; --muted:#67645f; --border:#d8d2c7; --border-strong:#aca69c; --red:#ee2946; --blue:#2a63d4; --green:#17755c; --amber:#9b630d; }
      @media (prefers-color-scheme:dark) { svg:not([data-theme]) { color-scheme:dark; --bg:#111114; --surface:#19191d; --subtle:#202025; --text:#f1efe9; --muted:#aaa7a1; --border:#34343a; --border-strong:#55555d; --red:#ff3a55; --blue:#79a8ff; --green:#65c7a6; --amber:#e0b05c; } }
      text { font-family:"Instrument Sans Variable","Arial Nova","Segoe UI",ui-sans-serif,system-ui,sans-serif; fill:var(--text); }
      rect { rx:4px; }
      .canvas { fill:var(--bg); }
      .scope,.owner,.interface { fill:var(--surface); stroke-width:1.5; }
      .scope,.owner { stroke:var(--border-strong); }
      .interface { stroke:var(--border); }
      .scope-head { fill:var(--subtle); }
      .divider { stroke:var(--border); stroke-width:1; }
      .green { fill:color-mix(in srgb,var(--green) 7%,var(--surface)); stroke:var(--green); stroke-width:1.5; }
      .red-box { fill:color-mix(in srgb,var(--red) 6%,var(--surface)); stroke:var(--red); stroke-width:1.5; }
      .label { font-size:20px; font-weight:700; }
      .small-label { font-size:15px; font-weight:700; }
      .small { font-size:14px; fill:var(--muted); }
      .mono { font-family:"JetBrains Mono Variable","SFMono-Regular",Consolas,monospace; font-size:14px; }
      .eyebrow { font-family:"JetBrains Mono Variable","SFMono-Regular",Consolas,monospace; font-size:14px; font-weight:700; letter-spacing:1.2px; fill:var(--red); }
      .marker-blue { fill:var(--blue); }
      .marker-red { fill:var(--red); }
      .arrow-blue,.arrow-red { fill:none; stroke-width:2; }
      .arrow-blue { stroke:var(--blue); marker-end:url(#connected-arrow-blue); }
      .arrow-red { stroke:var(--red); marker-end:url(#connected-arrow-red); }
      .ownership-line { fill:none; stroke:var(--border-strong); stroke-width:1.5; }
      .queue-line { stroke:var(--muted); stroke-width:1.5; }
      .blue-text { fill:var(--blue); }
      .red-text { fill:var(--red); }
      .muted-text { fill:var(--muted); }
    </style>
  </defs>
  <rect class="canvas" width="480" height="760"/>

  <text x="18" y="27" class="eyebrow">OWNERSHIP - 2 OF 2</text>
  <text x="18" y="56" class="label">Connected WebSocket lifetime</text>

  <rect x="18" y="76" width="444" height="80" class="interface"/>
  <rect x="18" y="76" width="9" height="80" fill="var(--blue)"/>
  <text x="42" y="104" class="eyebrow blue-text">BROWSER LIVESOCKET</text>
  <text x="42" y="136" class="small-label blue-text">Inbound frames</text>
  <text x="438" y="136" text-anchor="end" class="small-label red-text">Outbound frames</text>
  <path d="M137 156V184" class="arrow-blue"/>

  <rect x="18" y="194" width="444" height="550" class="scope"/>
  <rect x="18" y="194" width="444" height="68" class="scope-head"/>
  <path d="M18 262H462" class="divider"/>
  <text x="40" y="221" class="small-label">WEBSOCKET SCOPE / JOIN GATE</text>
  <text x="40" y="247" class="label">Signed admission</text>

  <rect x="40" y="282" width="190" height="78" class="interface"/>
  <text x="58" y="311" class="small-label">PhoenixProtocol</text>
  <text x="58" y="337" class="small">decodes inbound</text>
  <rect x="250" y="282" width="190" height="78" class="red-box"/>
  <text x="268" y="309" class="small-label">Physical Phoenix</text>
  <text x="268" y="330" class="small-label">writer</text>
  <text x="268" y="351" class="small">one per WebSocket</text>

  <path d="M135 360V380" class="arrow-blue"/>
  <rect x="40" y="390" width="400" height="62" class="owner"/>
  <text x="60" y="417" class="small-label">ConnectionSupervisor</text>
  <text x="60" y="439" class="small">owns topics, epochs, lifecycle scopes</text>
  <path d="M240 452V487M240 472H28V703H40" class="ownership-line"/>

  <rect x="40" y="487" width="400" height="162" class="owner"/>
  <text x="60" y="514" class="eyebrow">ROOT / 1</text>
  <text x="153" y="514" class="small-label">RootConnection</text>
  <text x="60" y="539" class="small-label blue-text">Bounded ingress</text>
  <text x="420" y="539" text-anchor="end" class="small">epoch-qualified queue</text>
  <path d="M60 550H420" class="divider"/>
  <text x="60" y="575" class="small-label">SessionKernel</text>
  <text x="420" y="575" text-anchor="end" class="small">single owner</text>
  <path d="M60 586H420" class="divider"/>
  <rect x="56" y="597" width="368" height="38" class="green"/>
  <text x="72" y="622" class="small-label">Committed revision</text>
  <text x="408" y="622" text-anchor="end" class="small">model + render</text>

  <rect x="40" y="671" width="400" height="64" class="owner"/>
  <text x="58" y="693" class="eyebrow">NESTED ROOTCONNECTIONS / 0..N</text>
  <text x="58" y="714" class="small">independent lifecycles; each owns ingress,</text>
  <text x="58" y="731" class="small">kernel and committed revision</text>

  <path d="M345 282V156" class="arrow-red"/>
  <path d="M424 616H452V374H345V360" class="arrow-red"/>
</svg>
