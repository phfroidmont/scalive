<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="813" viewBox="55 270 1490 813" role="img" aria-labelledby="ownership-title ownership-desc">
  <title id="ownership-title">Runtime ownership</title>
  <desc id="ownership-desc">A browser uses an HTTP request for a request-scoped disconnected lifecycle and a WebSocket for persistent connected lifecycles. The request mounts and renders a candidate, returns full HTML and bootstrap data, then closes without retaining a model. The WebSocket owns one physical Phoenix writer, PhoenixProtocol, and a ConnectionSupervisor. The supervisor owns one RootConnection and zero or more nested root connections; each lifecycle has bounded ingress, its own SessionKernel, and committed state.</desc>
  <defs>
    <marker id="ownership-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" class="marker-blue"/></marker>
    <marker id="ownership-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" class="marker-red"/></marker>
    <style>
      @import url("fonts.css");
      svg { color-scheme: light; --bg:#f4f1eb; --surface:#fff; --subtle:#ece8e0; --text:#171719; --muted:#67645f; --border:#d8d2c7; --border-strong:#aca69c; --red:#ee2946; --blue:#2a63d4; --green:#17755c; --amber:#9b630d; }
      svg[data-theme="dark"] { color-scheme:dark; --bg:#111114; --surface:#19191d; --subtle:#202025; --text:#f1efe9; --muted:#aaa7a1; --border:#34343a; --border-strong:#55555d; --red:#ff3a55; --blue:#79a8ff; --green:#65c7a6; --amber:#e0b05c; }
      svg[data-theme="light"] { color-scheme:light; --bg:#f4f1eb; --surface:#fff; --subtle:#ece8e0; --text:#171719; --muted:#67645f; --border:#d8d2c7; --border-strong:#aca69c; --red:#ee2946; --blue:#2a63d4; --green:#17755c; --amber:#9b630d; }
      @media (prefers-color-scheme:dark) { svg:not([data-theme]) { color-scheme:dark; --bg:#111114; --surface:#19191d; --subtle:#202025; --text:#f1efe9; --muted:#aaa7a1; --border:#34343a; --border-strong:#55555d; --red:#ff3a55; --blue:#79a8ff; --green:#65c7a6; --amber:#e0b05c; } }
      text { font-family:"Instrument Sans Variable","Arial Nova","Segoe UI",ui-sans-serif,system-ui,sans-serif; fill:var(--text); }
      rect { rx:4px; }
      .canvas { fill:var(--bg); }
      .label { font-size:18px; font-weight:700; }
      .small-label { font-size:15px; font-weight:700; }
      .small { font-size:14px; fill:var(--muted); }
      .mono { font-family:"JetBrains Mono Variable","SFMono-Regular",Consolas,monospace; font-size:14px; }
      .eyebrow { font-family:"JetBrains Mono Variable","SFMono-Regular",Consolas,monospace; font-size:14px; font-weight:700; letter-spacing:1.5px; fill:var(--red); }
      .scope,.owner,.interface { fill:var(--surface); stroke-width:1.5; }
      .scope,.owner { stroke:var(--border-strong); }
      .interface { stroke:var(--border); }
      .scope-head { fill:var(--subtle); }
      .green { fill:color-mix(in srgb,var(--green) 7%,var(--surface)); stroke:var(--green); stroke-width:1.5; }
      .amber { fill:color-mix(in srgb,var(--amber) 7%,var(--surface)); stroke:var(--amber); stroke-width:1.5; stroke-dasharray:9 7; }
      .red-box { fill:color-mix(in srgb,var(--red) 6%,var(--surface)); stroke:var(--red); stroke-width:1.5; }
      .divider { stroke:var(--border); stroke-width:1; }
      .ownership-line { fill:none; stroke:var(--border-strong); stroke-width:1.5; }
      .queue-line { stroke:var(--muted); stroke-width:1.5; }
      .marker-blue { fill:var(--blue); }
      .marker-red { fill:var(--red); }
      .arrow-blue,.arrow-red { fill:none; stroke-width:2; }
      .arrow-blue { stroke:var(--blue); marker-end:url(#ownership-arrow-blue); }
      .arrow-red { stroke:var(--red); marker-end:url(#ownership-arrow-red); }
      .flow-halo { fill:none; stroke:var(--surface); stroke-width:6; }
      .blue-text { fill:var(--blue); }
      .red-text { fill:var(--red); }
      .muted-text { fill:var(--muted); }
    </style>
  </defs>
  <rect class="canvas" x="55" y="270" width="1490" height="813"/>

  <rect x="70" y="285" width="1460" height="160" class="scope"/>
  <rect x="70" y="285" width="12" height="160" fill="var(--blue)"/>
  <text x="105" y="318" class="eyebrow blue-text">Browser</text>
  <text x="105" y="345" class="label">Phoenix LiveView client</text>
  <rect x="105" y="365" width="470" height="58" class="interface"/>
  <text x="130" y="399" class="small-label">HTTP document</text>
  <text x="350" y="400" text-anchor="middle" class="small-label blue-text">GET request</text>
  <text x="530" y="400" text-anchor="middle" class="small-label red-text">Full HTML</text>
  <rect x="625" y="365" width="870" height="58" class="interface"/>
  <text x="650" y="399" class="small-label">Live connection</text>
  <text x="1110" y="400" text-anchor="middle" class="small-label blue-text">Inbound frames</text>
  <text x="1372" y="400" text-anchor="middle" class="small-label red-text">Outbound frames</text>

  <rect x="70" y="480" width="1460" height="588" class="scope"/>
  <rect x="70" y="480" width="1460" height="55" class="scope-head"/>
  <path d="M70 535H1530" class="divider"/>
  <text x="98" y="515" class="label">ZIO HTTP transport</text>

  <rect x="95" y="565" width="480" height="455" class="scope"/>
  <rect x="95" y="565" width="480" height="65" class="scope-head"/>
  <text x="125" y="591" class="small-label">REQUEST SCOPE</text>
  <text x="125" y="617" class="label">Disconnected lifecycle</text>
  <rect x="125" y="655" width="330" height="56" class="interface"/>
  <text x="150" y="681" class="small-label">Route selection + mount aspects</text>
  <text x="150" y="702" class="small">typed route + session context</text>
  <path d="M290 711V735" class="arrow-blue"/>
  <rect x="125" y="745" width="375" height="140" class="owner"/>
  <text x="150" y="773" class="small-label">DisconnectedRootTurn</text>
  <text x="150" y="796" class="small">mount, params, hooks</text>
  <rect x="145" y="815" width="350" height="50" class="amber"/>
  <text x="165" y="837" class="small-label">Render candidate</text>
  <text x="165" y="857" class="small">program, components, request resources</text>
  <path d="M290 865V895" class="arrow-red"/>
  <rect x="125" y="905" width="330" height="64" class="red-box"/>
  <text x="150" y="932" class="small-label">Full HTML + bootstrap data</text>
  <text x="150" y="954" class="small">response retains no server model</text>
  <text x="125" y="995" class="mono muted-text">scope closes after response</text>

  <rect x="625" y="565" width="880" height="455" class="scope"/>
  <rect x="625" y="565" width="880" height="65" class="scope-head"/>
  <text x="655" y="591" class="small-label">WEBSOCKET SCOPE</text>
  <text x="850" y="591" class="small-label blue-text">JOIN GATE + SIGNED ADMISSION</text>
  <text x="655" y="617" class="label">Persistent connection runtime</text>
  <rect x="655" y="650" width="280" height="88" class="owner"/>
  <text x="795" y="679" text-anchor="middle" class="small-label">ConnectionSupervisor</text>
  <text x="795" y="702" text-anchor="middle" class="small">topics, epochs, topology</text>
  <text x="795" y="723" text-anchor="middle" class="small">owns lifecycle scopes</text>
  <rect x="1000" y="650" width="220" height="88" class="red-box"/>
  <text x="1110" y="684" text-anchor="middle" class="small-label">PhoenixProtocol</text>
  <text x="1110" y="707" text-anchor="middle" class="small">decodes envelopes</text>
  <rect x="1270" y="650" width="205" height="88" class="red-box"/>
  <text x="1372" y="684" text-anchor="middle" class="small-label">Physical Phoenix writer</text>
  <text x="1372" y="707" text-anchor="middle" class="small">one per WebSocket</text>
  <path d="M990 675H945" class="arrow-blue"/>
  <path d="M1220 715H1260" class="arrow-red"/>
  <path d="M795 738V780H1362M940 780V805M1362 780V805" class="ownership-line"/>

  <rect x="655" y="815" width="570" height="180" class="owner"/>
  <text x="685" y="843" class="small-label">ROOT LIFECYCLE / 1</text>
  <text x="685" y="869" class="label">RootConnection</text>
  <text x="1180" y="843" text-anchor="end" class="small-label red-text">ORDERED OUTPUT</text>
  <text x="1180" y="863" text-anchor="end" class="small mono">ConnectionOutput</text>
  <g transform="translate(675 890)">
    <line x1="0" y1="0" x2="0" y2="55" class="queue-line"/><line x1="9" y1="0" x2="9" y2="55" class="queue-line"/><line x1="18" y1="0" x2="18" y2="55" class="queue-line"/>
    <text x="32" y="11" class="small-label">Ingress queue</text><text x="32" y="33" class="small">bounded</text><text x="32" y="53" class="small">epoch-qualified</text>
  </g>
  <path d="M815 945H845" class="arrow-blue"/>
  <rect x="855" y="875" width="345" height="100" class="owner"/>
  <text x="875" y="907" class="small-label">SessionKernel</text><text x="875" y="932" class="small">single-owner</text><text x="875" y="953" class="small">transition fiber</text>
  <rect x="1000" y="888" width="185" height="74" class="green"/>
  <text x="1092" y="914" text-anchor="middle" class="small-label">Committed revision</text><text x="1092" y="936" text-anchor="middle" class="small">model + render</text><text x="1092" y="956" text-anchor="middle" class="small">components + resources</text>

  <rect x="1270" y="835" width="190" height="145" fill="var(--subtle)" stroke="var(--border)"/>
  <rect x="1250" y="815" width="200" height="155" class="owner"/>
  <text x="1275" y="843" class="small-label">NESTED / 0..n</text><text x="1275" y="869" class="small-label">Nested root connections</text><text x="1275" y="894" class="small">independent lifecycles</text>
  <rect x="1275" y="910" width="150" height="50" class="green"/><text x="1350" y="932" text-anchor="middle" class="small-label">own committed</text><text x="1350" y="951" text-anchor="middle" class="small-label">state</text>

  <path d="M350 423V645" class="arrow-blue"/>
  <path d="M455 937H530V433" class="arrow-red"/>
  <path d="M1110 423V640" class="arrow-blue"/>
  <path d="M1372 640V433" class="arrow-red"/>
  <path d="M1180 815V748" class="flow-halo"/><path d="M1180 815V748" class="arrow-red"/>
</svg>
