name: Publish snapshot

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-snapshot
      cancel-in-progress: true
    env:
      SCALIVE_REVISION: ${{ github.sha }}
      SCALIVE_DOCS_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting and Scalafix
        run: |
          nix develop --command mill --ticker false __.reformat + __.fix
          git diff --exit-code
      - name: Test repository
        run: nix develop --command mill --ticker false __.test
      - name: Check documentation and public API
        run: nix develop --command mill --ticker false documentation.check
      - name: Run root-slice browser gate
        run: nix develop --command ./scripts/e2e-run-root-slice.sh --retries=0
      - name: Run upstream browser gate
        run: nix develop --command ./scripts/e2e-run-upstream.sh --retries=0
      - name: Build and smoke-test documentation release
        run: |
          nix develop --command mill --ticker false documentation.site.assembly
          nix develop --command ./scripts/smoke-documentation-assembly.sh \
            out/documentation/site/assembly.dest/out.jar "$GITHUB_SHA"
          mkdir -p dist
          install -m 0644 out/documentation/site/assembly.dest/out.jar dist/scalive-docs.jar
      - name: Store documentation release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scalive-docs-${{ github.sha }}
          path: dist/scalive-docs.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Build published artifacts
        run: nix develop --command mill --ticker false scalive.publishArtifacts + scalive.testing.publishArtifacts
      - name: Publish snapshot
        run: nix develop --command mill --ticker false mill.javalib.SonatypeCentralPublishModule/
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}

  deploy-documentation:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: scalive-docs-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://scalive.dev
    steps:
      - name: Download documentation release
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: scalive-docs-${{ github.sha }}
          path: release
      - name: Upload and activate documentation release
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.SCALIVE_DOCS_DEPLOY_KEY }}
          DEPLOY_HOST: 37.27.138.62
          DEPLOY_USER: scalive-docs-deploy
          DEPLOY_GENERATION: ${{ github.run_id }}
          REVISION: ${{ github.sha }}
        run: |
          key_file="$RUNNER_TEMP/scalive-docs-deploy-key"
          known_hosts_file="$RUNNER_TEMP/scalive-docs-known-hosts"
          expected_health="$RUNNER_TEMP/scalive-docs-expected-health"
          actual_health="$RUNNER_TEMP/scalive-docs-actual-health"
          trap 'rm -f "$key_file" "$known_hosts_file" "$expected_health" "$actual_health"' EXIT
          install -m 0600 /dev/null "$key_file"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$key_file"
          printf '%s\n' \
            '37.27.138.62 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIq5MH9JDNRZPQIZ7EoqiK5iVHmcH6khsXjcPuvFj9mA' \
            > "$known_hosts_file"

          artifact=release/scalive-docs.jar
          size=$(stat -c %s "$artifact")
          checksum=$(sha256sum "$artifact" | cut -d ' ' -f1)
          ssh_options=(
            -i "$key_file"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
          )

          # The forced server command validates these values.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "upload $REVISION $size $checksum" < "$artifact"
          # The forced server command validates this value.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "activate $REVISION $DEPLOY_GENERATION"

          printf %s "$REVISION" > "$expected_health"
          for _ in {1..30}; do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              --header 'Cache-Control: no-cache' \
              --output "$actual_health" https://scalive.dev/health \
              && cmp --silent "$expected_health" "$actual_health"; then
              exit 0
            fi
            sleep 2
          done
          printf 'Public health did not report revision %s\n' "$REVISION" >&2
          exit 1
